window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    return v !== null ? { value: v } : null;
  },
  async set(key, value) {
    localStorage.setItem(key, value);

const SESSION_SIZE = 10;
const STORAGE_KEY = "hebrew_state_v1";

// ============================================================
// STORAGE HELPERS
// ============================================================
const defaultState = () => ({
  progress: {},
  stats: { xp: 0, streak: 0, lastDate: null, sessionsDone: 0 },
  settings: { cats: CATEGORIES.map((c) => c.id), mode: "type", practiceType: "words" },
  customWords: [],
});

async function loadState() {
  try {
    const r = await window.storage.get(STORAGE_KEY);
    if (r && r.value) return { ...defaultState(), ...JSON.parse(r.value) };
  } catch (e) {}
  return defaultState();
}

async function saveState(s) {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(s));
  } catch (e) {}
}

function buildQueue(words, progress) {
  const scored = words.map((w) => {
    const p = progress[w.id] || { seen: 0, correct: 0, streak: 0 };
    const masteryScore = p.seen === 0 ? -100 : p.streak - Math.random() * 2;
    return { w, score: masteryScore };
  });
  scored.sort((a, b) => a.score - b.score);
  return scored.slice(0, SESSION_SIZE).map((s) => s.w);
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

  const [sessionResults, setSessionResults] = useState([]);

  useEffect(() => {
    loadState().then((s) => {
      setState(s);
      setLoaded(true);
    });
  }, []);

  useEffect(() => {
    if (loaded) saveState(state);
  }, [state, loaded]);

  const allWords = useMemo(
    () => [...WORDS, ...(state.customWords || [])],
    [state.customWords]
  );

  const startSession = () => {
    if (state.settings.practiceType === "sentences") {
      const q = buildQueue(SENTENCES, state.progress);
      setQueue(q);
      setQi(0);
      setSessionResults([]);
      setView("session");
      return;
    }
    const cats = new Set(state.settings.cats);
    const pool = allWords.filter((w) => cats.has(w.cat));
    if (pool.length < 4) return;
    const q = buildQueue(pool, state.progress);
    setQueue(q);
    setQi(0);
    setSessionResults([]);
    setView("session");
  };

  const startChallengeSession = () => {
    const challengePool = [...allWords, ...SENTENCES];
    const challenges = challengePool.filter((w) => {
      const p = state.progress[w.id];
      return p && p.inChallenges;
    });
    if (challenges.length === 0) return;
    const shuffled = [...challenges].sort(() => Math.random() - 0.5);
    const q = shuffled.slice(0, SESSION_SIZE);
    setQueue(q);
    setQi(0);
    setSessionResults([]);
    setView("session");
  };

  const addCustomWord = (he, en, cat) => {
    const heTrim = (he || "").trim();
    const enTrim = (en || "").trim();
    if (!heTrim || !enTrim || !cat) return;
    setState((prev) => ({
      ...prev,
      customWords: [
        ...(prev.customWords || []),
        {
          id: "cw_" + Math.random().toString(36).slice(2, 10),
          he: heTrim,
          en: enTrim,
          cat,
        },
      ],
    }));
  };

  const deleteCustomWord = (id) => {
    setState((prev) => {
      const newProgress = { ...prev.progress };
      delete newProgress[id];
      return {
        ...prev,
        progress: newProgress,
        customWords: (prev.customWords || []).filter((w) => w.id !== id),
      };
    });
  };

  const recordAnswer = (word, correct) => {
    setSessionResults((prev) => [...prev, { word, correct }]);
    setState((prev) => {
      const p = prev.progress[word.id] || {
        seen: 0, correct: 0, streak: 0, missStreak: 0, inChallenges: false,
      };
      const nextWordStreak = correct ? (p.streak || 0) + 1 : 0;
      const nextMissStreak = correct ? 0 : (p.missStreak || 0) + 1;
      let nextInChallenges = p.inChallenges || false;
      if (!correct) nextInChallenges = true;
      if (nextInChallenges && nextWordStreak >= 3) nextInChallenges = false;
      const newP = {
        seen: p.seen + 1,
        correct: p.correct + (correct ? 1 : 0),
        streak: nextWordStreak,
        missStreak: nextMissStreak,
        inChallenges: nextInChallenges,
        lastSeen: Date.now(),
      };
      const today = todayStr();
      const isNewDay = prev.stats.lastDate !== today;
      const dayGap =
        prev.stats.lastDate &&
        (new Date(today) - new Date(prev.stats.lastDate)) / 86400000;
      let newDayStreak = prev.stats.streak;
      if (isNewDay) {
        newDayStreak = dayGap === 1 ? newDayStreak + 1 : 1;
      }
      return {
        ...prev,
        progress: { ...prev.progress, [word.id]: newP },
        stats: {
          ...prev.stats,
          xp: prev.stats.xp + (correct ? 10 : 2),
          streak: newDayStreak,
          lastDate: today,
        },
      };
    });
  };

  const nextCard = () => {
    const lastResult = sessionResults[sessionResults.length - 1];
    const justAnsweredWord = queue[qi];
    const wasTyped =
      justAnsweredWord &&
      (justAnsweredWord.cat === "sentence" || state.settings.mode === "type");
    const shouldRequeue =
      wasTyped && lastResult && !lastResult.correct && justAnsweredWord;

    if (shouldRequeue) {
      setQueue((prevQueue) => {
        const insertAt = Math.min(qi + 4, prevQueue.length);
        const newQueue = [...prevQueue];
        newQueue.splice(insertAt, 0, justAnsweredWord);
        return newQueue;
      });
      setQi(qi + 1);
      return;
    }

    if (qi + 1 >= queue.length) {
      setState((prev) => ({
        ...prev,
        stats: { ...prev.stats, sessionsDone: prev.stats.sessionsDone + 1 },
      }));
      setView("done");
    } else {
      setQi(qi + 1);
    }
  };

  if (!loaded) return html`<${LoadingView} />`;

  return html`
    <div style=${styles.appShell}>
      <${GlobalStyles} />
      <${Header} stats=${state.stats} onHome=${() => setView("home")} />
      <main style=${styles.main}>
        ${view === "home" && html`<${HomeView}
          state=${state}
          setState=${setState}
          allWords=${allWords}
          onStart=${startSession}
          onStartChallenge=${startChallengeSession}
          onOpenWordBank=${() => setView("wordbank")}
        />`}
        ${view === "wordbank" && html`<${WordBankView}
          customWords=${state.customWords || []}
          onAdd=${addCustomWord}
          onDelete=${deleteCustomWord}
          onBack=${() => setView("home")}
        />`}
        ${view === "session" && queue[qi] && html`<${SessionView}
          key=${queue[qi].id + qi}
          word=${queue[qi]}
          progress=${qi + 1}
          total=${queue.length}
          mode=${queue[qi].cat === "sentence" ? "type" : state.settings.mode}
          onAnswer=${recordAnswer}
          onNext=${nextCard}
        />`}
        ${view === "done" && html`<${DoneView}
          results=${sessionResults}
          onHome=${() => setView("home")}
          onAgain=${startSession}
        />`}
      </main>
      <footer style=${styles.footer}>
        עברית עסקית · Business Hebrew Practice
      </footer>
    </div>
  `;
}

// ============================================================
function normalizeHebrew(s) {
  let out = s
    .replace(/[֑-ׇ]/g, "")
    .replace(/[׳״]/g, "")
    .replace(/["'׳״]/g, "")
    .replace(/[־\-]/g, " ")
    .replace(/[.,;:!?״׃]/g, "")
    .replace(/\s+/g, " ")
    .trim();
  const finalMap = { ך: "כ", ם: "מ", ן: "נ", ף: "פ", ץ: "צ" };
  out = out.replace(/[ךםןףץ]/g, (c) => finalMap[c] || c);
  return out;
}

function hebrewAnswerMatches(input, word) {
  const typed = normalizeHebrew(input);
  const ktivMale = normalizeHebrew(word.he);
  if (typed === ktivMale) return true;
  if (word.heN) {
    const ktivHaser = normalizeHebrew(word.heN);
    if (typed === ktivHaser) return true;
  }
  return false;
}

function TypeCard({ word, onAnswer, onNext }) {
  const [input, setInput] = useState("");
  const [submitted, setSubmitted] = useState(null);
  const inputRef = useRef(null);

  const isSentence = word.cat === "sentence";

  useEffect(() => {
    inputRef.current?.focus();
  }, []);

  const handleSubmit = () => {
    if (submitted) return;
    if (!input.trim()) return;
    const correct = hebrewAnswerMatches(input, word);
    setSubmitted({ correct });
    onAnswer(word, correct);
  };

  const handleShowAnswer = () => {
    if (submitted) return;
    setSubmitted({ correct: false, revealed: true });
    onAnswer(word, false);
  };

  const handleKeyDown = (e) => {
    if (e.key !== "Enter") return;
    if (isSentence && e.shiftKey) return;
    e.preventDefault();
    if (submitted) {
      onNext();
    } else if (input.trim()) {
      handleSubmit();
    }
  };

  return html`<${React.Fragment}>
    <div style=${styles.quizPrompt}>
      <div style=${styles.quizPromptLabel}>
        ${isSentence ? "Write this sentence in Hebrew" : "Write in Hebrew"}
      </div>
      <div style=${styles.quizPromptWord}>
        <span style=${isSentence ? styles.quizEnglishSentence : styles.quizEnglish}>
          ${word.en}
        </span>
      </div>
    </div>

    <div style=${styles.typeWrap}>
      ${isSentence
        ? html`<textarea
            ref=${inputRef}
            dir="rtl"
            lang="he"
            value=${input}
            onChange=${(e) => setInput(e.target.value)}
            onKeyDown=${handleKeyDown}
            readOnly=${!!submitted}
            placeholder="…כתוב כאן"
            autoComplete="off"
            autoCorrect="off"
            autoCapitalize="off"
            spellCheck=${false}
            rows=${3}
            style=${{
              ...styles.typeInput,
              ...styles.typeTextarea,
              ...(submitted ? (submitted.correct ? styles.typeInputCorrect : styles.typeInputWrong) : {}),
            }}
          />`
        : html`<input
            ref=${inputRef}
            type="text"
            dir="rtl"
            lang="he"
            value=${input}
            onChange=${(e) => setInput(e.target.value)}
            onKeyDown=${handleKeyDown}
            readOnly=${!!submitted}
            placeholder="…הקלד כאן"
            autoComplete="off"
            autoCorrect="off"
            autoCapitalize="off"
            spellCheck=${false}
            style=${{
              ...styles.typeInput,
              ...(submitted ? (submitted.correct ? styles.typeInputCorrect : styles.typeInputWrong) : {}),
            }}
          />`}
      ${!submitted && html`
        <div style=${styles.typeBtnRow}>
          <button onClick=${handleShowAnswer} style=${styles.typeSkipBtn}>
            Show answer
          </button>
          <button
            onClick=${handleSubmit}
            disabled=${!input.trim()}
            style=${{
              ...styles.typeSubmitBtn,
              ...(!input.trim() ? styles.typeSubmitBtnDisabled : {}),
            }}
          >Check →</button>
        </div>
      `}
    </div>

    ${submitted && html`
      <div style=${styles.revealPanel}>
        <div style=${{
          ...styles.revealStatus,
          color: submitted.correct ? "var(--success)" : "var(--error)",
        }}>
          ${submitted.correct ? "נכון" : "Not quite"}
        </div>
        <div style=${{
          ...styles.revealHebrew,
          ...(isSentence ? styles.revealHebrewSentence : {}),
        }} dir="rtl">
          ${word.heN || word.he}
        </div>
        ${word.tr && html`<div style=${{
          ...styles.revealTr,
          ...(isSentence ? styles.revealTrSentence : {}),
        }}>${word.tr}</div>`}
        <div style=${styles.revealEn}>${word.en}</div>
        <button onClick=${onNext} style=${styles.revealNextBtn}>Continue →</button>
      </div>
    `}
  <//>`;
}

// ============================================================
// DONE VIEW
// ============================================================
function DoneView({ results, onHome, onAgain }) {
  const correct = results.filter((r) => r.correct).length;
  const total = results.length;
  const pct = Math.round((correct / total) * 100);

  return html`
    <div style=${styles.doneWrap}>
      <div style=${styles.doneEyebrow}>Session complete</div>
      <div style=${styles.doneScore}>${pct}%</div>
      <div style=${styles.doneDetail}>
        ${correct} of ${total} correct · +${correct * 10 + (total - correct) * 2} XP
      </div>
      <div style=${styles.doneList}>
        ${results.map((r, i) => html`<div key=${i} style=${styles.doneRow}>
          <span style=${{
            ...styles.doneDot,
            background: r.correct ? "var(--success)" : "var(--error)",
          }} />
          <span style=${styles.doneHe} dir="rtl">${r.word.he}</span>
          <span style=${styles.doneEn}>${r.word.en}</span>
        </div>`)}
      </div>
      <div style=${styles.doneBtns}>
        <button onClick=${onHome} style=${styles.doneBtnSecondary}>Back</button>
        <button onClick=${onAgain} style=${styles.doneBtnPrimary}>Another round →</button>
      </div>
    </div>
  `;
}

// ============================================================
// MISC
// ============================================================
function LoadingView() {
  return html`
    <div style=${styles.loadingWrap}>
      <${GlobalStyles} />
      <div style=${styles.loadingText}>טוען…</div>
    </div>
  `;
}
